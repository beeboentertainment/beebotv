<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
  <title id="t">Sharing your library with another household</title>
  <desc id="d">You invite one person by email. Your computer at home then streams your own library straight to them in their house. Beebo keeps no copy.</desc>
  <rect width="640" height="360" rx="18" fill="#FBF6EE"/>
  <!-- your house -->
  <g transform="translate(46 92)">
    <path d="M70 0L140 56H0z" fill="#E9B865"/>
    <rect x="16" y="56" width="108" height="80" rx="6" fill="#F4D9A8"/>
    <rect x="44" y="76" width="52" height="40" rx="4" fill="#22251F"/>
    <path d="M62 86l18 10-18 10z" fill="#FFC531"/>
    <text x="70" y="166" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#22251F">Your house</text>
    <text x="70" y="188" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="14" fill="#686B60">your films, your computer</text>
  </g>
  <!-- invite + stream -->
  <g transform="translate(206 96)">
    <!-- envelope -->
    <g transform="translate(58 0)">
      <rect width="110" height="62" rx="8" fill="#FFFFFF" stroke="#E0D2BB" stroke-width="2"/>
      <path d="M8 12l47 30 47-30" fill="none" stroke="#AB6513" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="55" y="86" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#8A5A12">one invite, by email</text>
    </g>
    <path d="M6 136h214" stroke="#AB6513" stroke-width="4" stroke-linecap="round"/>
    <path d="M212 128l10 8-10 8" fill="none" stroke="#AB6513" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="113" y="166" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#22251F">encrypted, straight to them</text>
    <text x="113" y="186" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="14" fill="#686B60">Beebo keeps no copy</text>
  </g>
  <!-- their house -->
  <g transform="translate(452 92)">
    <path d="M70 0L140 56H0z" fill="#B9C9A8"/>
    <rect x="16" y="56" width="108" height="80" rx="6" fill="#D7E0CB"/>
    <rect x="44" y="76" width="52" height="40" rx="4" fill="#22251F"/>
    <path d="M62 86l18 10-18 10z" fill="#FFC531"/>
    <text x="70" y="166" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#22251F">Their house</text>
    <text x="70" y="188" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="14" fill="#686B60">one person you invited</text>
  </g>
</svg>
