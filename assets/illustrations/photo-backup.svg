<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
  <title id="t">Camera backup to your computer</title>
  <desc id="d">Your phone copies its camera photos and videos over your home Wi-Fi into a Phone backups folder on your own computer. Nothing is deleted from the phone.</desc>
  <rect width="640" height="360" rx="18" fill="#FBF6EE"/>
  <!-- phone -->
  <g transform="translate(58 92)">
    <rect width="96" height="164" rx="14" fill="#22251F"/>
    <rect x="9" y="16" width="78" height="132" rx="6" fill="#E8EBDF"/>
    <g fill="#E9B865">
      <rect x="15" y="22" width="32" height="32" rx="4"/>
      <rect x="51" y="22" width="32" height="32" rx="4" fill="#B9C9A8"/>
      <rect x="15" y="58" width="32" height="32" rx="4" fill="#B9C9A8"/>
      <rect x="51" y="58" width="32" height="32" rx="4"/>
      <rect x="15" y="94" width="32" height="32" rx="4"/>
      <rect x="51" y="94" width="32" height="32" rx="4" fill="#B9C9A8"/>
    </g>
    <text x="48" y="196" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#22251F">Your phone</text>
    <text x="48" y="218" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="14" fill="#686B60">nothing is deleted</text>
  </g>
  <!-- wifi arrow -->
  <g transform="translate(196 150)">
    <path d="M0 24h96" stroke="#AB6513" stroke-width="4" stroke-linecap="round"/>
    <path d="M88 16l10 8-10 8" fill="none" stroke="#AB6513" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="none" stroke="#AB6513" stroke-width="4" stroke-linecap="round">
      <path d="M34 4a22 22 0 0 1 30 0"/>
      <path d="M42 -8a38 38 0 0 1 14 0"/>
    </g>
    <text x="49" y="52" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#8A5A12">on Wi-Fi</text>
  </g>
  <!-- PC -->
  <g transform="translate(320 96)">
    <rect x="0" y="0" width="160" height="104" rx="10" fill="#22251F"/>
    <rect x="9" y="9" width="142" height="80" rx="4" fill="#FBF6EE"/>
    <g transform="translate(24 22)">
      <path d="M0 10h26l7 7h44v44H0z" fill="#F4D9A8"/>
      <path d="M0 24h77v37H0z" fill="#E9B865"/>
    </g>
    <rect x="62" y="104" width="36" height="16" fill="#22251F"/>
    <rect x="42" y="120" width="76" height="8" rx="4" fill="#22251F"/>
    <text x="80" y="156" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#22251F">Your computer</text>
    <text x="80" y="178" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="14" fill="#686B60">Phone backups folder</text>
  </g>
  <!-- folder path card -->
  <g transform="translate(508 132)">
    <rect width="104" height="96" rx="12" fill="#FFFFFF" stroke="#E0D2BB" stroke-width="2"/>
    <g font-family="DM Sans,Arial,sans-serif" font-size="13" fill="#22251F">
      <text x="14" y="28">Phone backups</text>
      <text x="24" y="52">Pixel</text>
      <text x="34" y="74">2026</text>
    </g>
  </g>
</svg>
